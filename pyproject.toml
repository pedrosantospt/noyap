[project]
name = "noyap"
version = "0.1.0"
description = "Result-first agent skill for compact, honest output"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
  "ai-agents",
  "agent-skills",
  "prompt-engineering",
  "coding-agents",
  "llm",
  "tokens",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development",
]

[tool.unittest]
start-dir = "tests"
